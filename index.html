<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dünya Kupası Penaltı</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #061a0f 0%, #010503 100%);
            color: #fff; font-family: system-ui, sans-serif;
            text-align: center; overflow: hidden; user-select: none;
        }
        .container {
            padding: 15px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; height: 100vh; box-sizing: border-box;
        }
        h1 { color: #d4af37; margin: 5px 0; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px rgba(212,175,55,0.4); }
        .stats {
            display: flex; justify-content: space-around; width: 100%; max-width: 320px;
            background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 10px; border: 1px solid #d4af37;
        }
        .stadium {
            position: relative; width: 100%; max-width: 340px; height: 230px;
            background: linear-gradient(to bottom, #092b18 0%, #0f3d22 100%);
            border-bottom: 4px solid #fff; border-radius: 4px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .goal-post {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            width: 240px; height: 110px; border: 4px solid #fff; border-bottom: none;
            background: rgba(255, 255, 255, 0.05); transition: all 0.2s;
        }
        /* Kaleci İlk Duruş */
        .goalkeeper {
            position: absolute; bottom: 0; left: 50%; transform: AlaskaX(-50%);
            font-size: 45px; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 50px; height: 50px; line-height: 50px; text-align: center; margin-left: -25px;
        }
        /* Futbol Topu İlk Duruş */
        .ball {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 28px; transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; }
        .btn {
            background: #000; border: 1px solid #d4af37; color: #d4af37;
            padding: 14px 5px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn:active { transform: scale(0.95); background: #d4af37; color: #000; }
        .result-msg { height: 30px; font-size: 18px; font-weight: bold; }

        /* --- GERÇEK ANİMASYON EFEKTLERİ --- */
        .gk-dive-left { transform: translate(-80px, -40px) rotate(-70deg) !important; }
        .gk-dive-right { transform: translate(80px, -40px) rotate(70deg) !important; }
        .gk-dive-center { transform: translate(0px, -50px) scale(1.1) !important; }
        .gk-dive-left-low { transform: translate(-80px, 0px) rotate(-90deg) !important; }
        .gk-dive-right-low { transform: translate(80px, 0px) rotate(90deg) !important; }
        
        .ball-fly { transform: translateX(-50%) scale(0.4) rotate(720deg) !important; }
        .net-shake { animation: netShake 0.2s 2; }
        @keyframes netShake { 0% { top: 30px; } 50% { top: 27px; } 100% { top: 30px; } }
    </style>
</head>
<body>

<div class="container" id="gameContainer">
    <div>
        <h1>🏆 DÜNYA KUPASI</h1>
        <div class="result-msg" id="msg">Şut açısını seç ve vur!</div>
    </div>
    
    <div class="stats">
        <div>Kalan Hak: <span id="hak" style="color:#d4af37">5</span></div>
        <div>Gol: <span id="gol" style="color:#d4af37">0</span></div>
    </div>

    <div class="stadium">
        <div class="goal-post" id="net"></div>
        <div class="goalkeeper" id="gk">🧤</div>
        <div class="ball" id="ball">⚽</div>
    </div>

    <div class="controls" id="controls">
        <button class="btn" onclick="shoot(1)">Sol Üst</button>
        <button class="btn" onclick="shoot(2)">Orta Üst</button>
        <button class="btn" onclick="shoot(3)">Sağ Üst</button>
        <button class="btn" onclick="shoot(4)">Sol Alt</button>
        <button class="btn" onclick="shoot(5)">Orta Alt</button>
        <button class="btn" onclick="shoot(6)">Sağ Alt</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🎯 6. MADDE: KALECİ YETENEĞİ (%85 İHTİMALLE TUTAR)
    const GOALKEEPER_DIFFICULTY = 85;

    // 2. MADDE ÇÖZÜMÜ: URL parametrelerinden hakkı var mı kontrol et
    const urlParams = new URLSearchParams(window.location.search);
    const remSeconds = parseInt(urlParams.get('rem') || '0');

    if (remSeconds > 0) {
        // Eğer kullanıcının bekleme süresi varsa ekranı kilitle, oynatma!
        const hours = Math.floor(remSeconds / 3600);
        const minutes = Math.floor((remSeconds % 3600) / 60);
        document.getElementById('gameContainer').innerHTML = `
            <div style="margin: auto; padding: 20px;">
                <h1 style="color:#e74c3c">❌ ERİŞİM ENGELLENDİ</h1>
                <p style="font-size:16px; margin-top:20px;">Bugünlük oynama hakkınız dolmuştur.</p>
                <p style="color:#d4af37; font-size:18px; font-weight:bold;">Kalan Süre: ${hours} saat ${minutes} dakika</p>
            </div>
        `;
    }

    let hak = 5; let gol = 0; let isShooting = false;

    // Şut hedef koordinatları
    const ballTargets = {
        1: { top: '35px', left: '22%' }, 2: { top: '35px', left: '50%' }, 3: { top: '35px', left: '78%' },
        4: { top: '105px', left: '22%' }, 5: { top: '105px', left: '50%' }, 6: { top: '105px', left: '78%' }
    };

    function shoot(secim) {
        if (hak <= 0 || isShooting) return;
        isShooting = true;

        const gk = document.getElementById('gk');
        const ball = document.getElementById('ball');
        const msg = document.getElementById('msg');
        const net = document.getElementById('net');

        // %85 Algoritması ile kalecinin hamlesini belirle
        let gkSecim;
        if ((Math.floor(Math.random() * 100) + 1) <= GOALKEEPER_DIFFICULTY) {
            gkSecim = secim; // Kaleci şutu kesin biliyor
        } else {
            gkSecim = [1,2,3,4,5,6].filter(x => x !== secim)[Math.floor(Math.random() * 5)];
        }

        // 1. MADDE: Animasyon sınıflarını yükle
        ball.classList.add('ball-fly');
        ball.style.top = ballTargets[secim].top;
        ball.style.left = ballTargets[secim].left;

        if(gkSecim === 1 || gkSecim === 4) gk.classList.add(gkSecim===1 ? 'gk-dive-left':'gk-dive-left-low');
        else if(gkSecim === 3 || gkSecim === 6) gk.classList.add(gkSecim3 ? 'gk-dive-right':'gk-dive-right-low');
        else gk.classList.add('gk-dive-center');

        hak--;
        document.getElementById('hak').innerText = hak;

        setTimeout(() => {
            if (secim !== gkSecim) {
                gol++;
                document.getElementById('gol').innerText = gol;
                msg.innerText = "⚽ MUHTEŞEM GOL!";
                msg.style.color = "#2ecc71";
                net.classList.add('net-shake');
            } else {
                msg.innerText = "🧤 KALECİ KURTARDI!";
                msg.style.color = "#e74c3c";
            }
        }, 350);

        // Sahayı sıfırlama animasyonu
        setTimeout(() => {
            net.classList.remove('net-shake');
            if (hak > 0) {
                gk.className = "goalkeeper";
                ball.className = "ball";
                ball.style.top = ""; ball.style.left = "50%";
                msg.innerText = "Şut açısını seç ve vur!"; msg.style.color = "#fff";
                isShooting = false;
            } else {
                document.getElementById('controls').style.display = 'none';
                msg.innerText = `Oyun Bitti! Skor: ${gol} Gol.`;
                msg.style.color = "#d4af37";
                setTimeout(() => {
                    tg.sendData(JSON.stringify({ "gol_sayisi": gol }));
                    tg.close();
                }, 2000);
            }
        }, 1600);
    }
</script>
</body>
</html>
